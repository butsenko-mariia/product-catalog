<html lang="en">

    <title>product-catalog</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #fdfbfb;

        background-image:
          radial-gradient(
            at 15% 15%,
            rgba(255, 209, 220, 0.7) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 85% 20%,
            rgba(224, 204, 255, 0.7) 0px,

          ),
          radial-gradient(
            at 80% 80%,
            rgba(199, 235, 255, 0.7) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 15% 85%,
            rgba(191, 245, 235, 0.7) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 50% 50%,
            rgba(255, 225, 245, 0.5) 0px,
            transparent 50%
          );

        background-repeat: no-repeat;
        background-attachment: fixed; /* Фон зафиксирован при скролле */
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
